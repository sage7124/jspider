<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICT Portal Gateway | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #1e1b4b 50%, #0f172a 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.5);
        }
        .glow-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-4 text-white selection:bg-blue-500">

    <main class="relative w-full max-w-md z-10 my-12 animate-fadeIn">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="relative w-24 h-24 mx-auto mb-6">
                <div class="w-full h-full bg-gradient-to-br from-blue-500 to-indigo-600 rounded-3xl flex items-center justify-center border border-white/20 overflow-hidden shadow-2xl">
                    <img src="logo.jpeg" alt="Logo" class="w-full h-full object-contain p-1" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <span class="hidden font-extrabold text-3xl tracking-tighter">NICT</span>
                </div>
            </div>
            <h2 class="text-[11px] font-extrabold text-cyan-400 uppercase tracking-[0.3em] mb-2">NICT Computer Education Pvt Ltd</h2>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Data Management System</h1>
        </div>

        <!-- Main Selection Card -->
        <div class="glass rounded-[2rem] p-8 transition-all duration-500">
            
            <div class="mb-8 text-center border-b border-white/10 pb-5">
                <p class="text-sm text-blue-200/70 font-medium">Secure Central Access</p>
                <p class="text-xl font-bold text-white mt-1 flex items-center justify-center gap-2">
                    <span class="text-2xl">🌐</span> Select Your NICT Location
                </p>
            </div>

            <!-- Direct Link Buttons -->
            <div class="space-y-5">
                <!-- Branch 1 -->
                <a href="https://nictjayanagar.vercel.app/login" 
                   class="glow-card group relative flex items-center justify-between w-full p-5 bg-white/5 rounded-2xl border border-white/10 transition-all active:scale-[0.98]">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-500 to-cyan-400 flex items-center justify-center font-extrabold text-xl text-white shadow-lg group-hover:scale-110 transition-transform">
                            J
                        </div>
                        <div class="text-left">
                            <h3 class="text-base font-bold text-white group-hover:text-cyan-300 transition-colors">NICT Jayanagar</h3>
                            <p class="text-[11px] text-blue-200/60 font-medium mt-0.5">Access Student Hub</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-blue-500 transition-colors">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>

                <!-- Branch 2 -->
                <a href="https://nicthanumanthnagar.vercel.app/login" 
                   class="glow-card group relative flex items-center justify-between w-full p-5 bg-white/5 rounded-2xl border border-white/10 transition-all active:scale-[0.98]">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-400 flex items-center justify-center font-extrabold text-xl text-white shadow-lg group-hover:scale-110 transition-transform">
                            H
                        </div>
                        <div class="text-left">
                            <h3 class="text-base font-bold text-white group-hover:text-indigo-300 transition-colors">NICT Hanumanthanagar</h3>
                            <p class="text-[11px] text-blue-200/60 font-medium mt-0.5">Access Student Hub</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-indigo-500 transition-colors">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>
            </div>

            <div class="relative flex py-8 items-center">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="flex-shrink mx-4 text-[10px] text-blue-200/30 uppercase font-bold tracking-widest">Account Management</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <!-- THIS IS THE GUARANTEED LINK - NO MORE TICKET CONFLICTS -->
            <a href="register.html" class="w-full flex items-center justify-center gap-2 px-8 py-4 font-bold text-white bg-gradient-to-r from-cyan-600 to-blue-600 rounded-xl hover:from-cyan-500 hover:to-blue-500 shadow-lg transform hover:scale-[1.02] transition-all duration-200 text-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                Register Here
            </a>

        </div>

        <p class="text-center mt-10 text-xs text-blue-200/30">&copy; 2026 NICT Computer Education Pvt Ltd.</p>
    </main>

</body>
</html>
